<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dan Hammer</title>
  <meta name="description" content="Dan Hammer — environmental data science.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="icon" href="../r/img/favicon.ico">
  <style>
    /* Always dark: Claude Code's palette in the VS Code terminal. */
    :root {
      --bg: #1e1e1e;
      --fg: #cccccc;
      --dim: #999999;
      --rule: #888888;
      --accent: #d77757;   /* Claude orange, for the active spinner */
      --lavender: #b3b9f4;
      --err: #e06c75;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body {
      color: var(--fg);
      font: 400 15px/1.25 Menlo, Monaco, "DejaVu Sans Mono", Consolas, "Liberation Mono", monospace;
    }
    a { color: var(--lavender); text-decoration: underline; text-underline-offset: 2px; }
    ::selection { background: #264f78; }

    .term { padding: 16px 0 40vh; }
    .pad { padding: 0 16px; }

    /* ASCII banner (figlet "ICL-1900": the name punched into a computer card, beside a holes-only card for "Be kind, be kind, be kind"), printed top to bottom on load */
    .banner { margin: 0 0 1.25em; font-weight: 400; font-size: inherit; color: var(--accent); }
    .banner pre { margin: 0; font: inherit; line-height: 1.15; font-size: min(1em, calc((100vw - 32px) / 46 / 0.61)); }

    /* Transcript */
    .entry { margin: 0 0 1.25em; }
    .echo { color: var(--dim); white-space: pre-wrap; word-break: break-word; }
    .echo::before { content: "❯ "; }
    .reply { display: flex; gap: 1ch; margin-top: 1.25em; }
    .reply .dot { flex: none; color: var(--fg); }
    .done { color: var(--dim); margin-top: 1.25em; }
    .reply .dot.err { color: var(--err); }
    .reply .body { min-width: 0; white-space: pre-wrap; word-break: break-word; }
    .reply .body p { margin: 0 0 1.25em; white-space: normal; }
    .reply .body p:last-child { margin: 0; }
    .muted { color: var(--dim); }
    .cmd { color: var(--lavender); }

    .spinner { color: var(--accent); margin-top: 1.25em; }
    .spinner .hint { color: var(--dim); }

    /* Prompt box */
    .prompt {
      position: relative;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      padding: 6px 16px;
      display: flex;
      gap: 1ch;
      cursor: text;
    }
    .prompt .sign { flex: none; }
    .line { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-all; }
    .placeholder { color: var(--dim); }
    .cursor {
      display: inline-block;
      width: 1ch;
      height: 1.2em;
      vertical-align: text-bottom;
      background: var(--fg);
      animation: blink 1.06s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    /* The real input sits invisibly over the box, so mobile keyboards and IME still work */
    #input {
      position: absolute;
      inset: 0;
      width: 100%;
      opacity: 0;
      border: 0;
      font: inherit;
      background: transparent;
    }
    .footer-hint { color: var(--dim); margin: 4px 0 0; padding: 0 16px 0 calc(16px + 2ch); min-height: 1.25em; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 2ch; }
    .footer-hint .status { margin-left: auto; }
    .footer-hint .on { color: #5cc9cb; }
    .footer-hint .off { color: var(--err); }

    /* Slash-command menu */
    .menu { margin: 4px 0 0; padding: 0 16px 0 calc(16px + 2ch); }
    .menu .row { display: flex; gap: 3ch; color: var(--dim); cursor: pointer; }
    .menu .row .name { min-width: 12ch; }
    .menu .row.sel { color: var(--lavender); }

    @media (max-width: 520px) {
      body { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="term">
    <h1 class="banner pad" aria-label="Dan Hammer, Ph.D."><pre id="banner" aria-hidden="true"></pre></h1>

    <div id="log" class="pad" aria-live="polite"></div>

    <div class="prompt">
      <span class="sign">❯</span>
      <div class="line" aria-hidden="true"><span id="typed"></span><span class="cursor"></span><span id="ph" class="placeholder">Try "/bio"</span></div>
      <input id="input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command">
    </div>
    <div class="menu" id="menu" hidden></div>
    <div class="footer-hint"><span id="hint">? for shortcuts</span><span class="status" id="status"></span></div>
  </div>

  <!-- Content printed by commands. To add one (e.g. /headshot, /cv), add a template and an entry in COMMANDS. -->
  <template id="bio">
    <p>Dr. Dan Hammer is a Managing Partner at <a href="https://ode.partners">Ode</a>, a tech and design agency for the environment. He is the winner of the inaugural <a href="https://www.ioes.ucla.edu/pritzker-genius/">Pritzker Environmental Genius Award</a>; a member of the Brain Trust at XPRIZE; and a Senior Technical Advisor at Earth Alliance.</p>
    <p>Dan earned his PhD in environmental economics from U.C. Berkeley, where he was a Fellow at the Berkeley Institute for Data Science and won the 2019 <a href="https://alumni.berkeley.edu/announcements/caa-announcements/passing-gift-transformation-2019-berkeley-charter-gala">Mark Bingham Prize for Excellence by a Young Alumnus</a>. He previously served as a Senior Policy Advisor in the Obama White House and a Presidential Innovation Fellow at NASA.</p>
    <p>Dan was the Chief Data Scientist at the World Resources Institute, where he co-founded <a href="https://www.globalforestwatch.org">Global Forest Watch</a>. He has been a National Geographic Fellow and a lead math instructor at San Quentin State Prison with the Prison University Project. Dan graduated with high honors in mathematics and economics from Swarthmore College, where he was a Lang Opportunity Scholar and a Watson Fellow.</p>
  </template>

  <script>
    // Print the banner in line by line, top to bottom.
    (function () {
      var art = "Dan Hammer, Ph.D.\n**  **  * *  ****    **  * ** **  * ** **  * *\n  *   ** *  *           * *      * *      * *\n\n *   *\n                     *  *     *  *     *  *\n              * *\n*     **       *           *        *        *\n  *     *             *   *    *   *    *   *\n          *                 *        *\n            *\n    *     *  ** *           *        *\n         *               *        *        *".split('\n');
      var el = document.getElementById('banner');
      // Pad with blank lines first so the layout below doesn't jump as rows appear.
      function show(rows) { el.textContent = art.map(function (l, i) { return i < rows ? l : ' '; }).join('\n'); }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { show(art.length); return; }
      var row = 0;
      show(0);
      var t = setInterval(function () { show(++row); if (row >= art.length) clearInterval(t); }, 90);
    })();

    (function () {
      var log = document.getElementById('log');

      // Files live in r/headshots/; add a line here when you add one.
      var HEADSHOTS = [
        { url: 'https://danham.me/r/headshots/profile_color.jpg', note: 'color, 1250×1250' },
        { url: 'https://danham.me/r/headshots/profile_bw.jpg', note: 'black & white, 2000×2000' }
      ];

      // name -> { desc, run(body) }. `instant` skips the thinking spinner; `silent` prints no transcript entry.
      var COMMANDS = {
        '/bio': { desc: 'Print a short bio', run: function (body) { return stream(body, tpl('bio')); } },
        '/cv': { desc: 'Link to my CV (PDF)', run: function (body) {
          body.innerHTML = 'Click to open my CV: <a href="https://danham.me/r/cv.pdf" target="_blank" rel="noopener">https://danham.me/r/cv.pdf</a>';
        } },
        '/headshot': { desc: 'List headshot image URLs', run: function (body) {
          body.innerHTML = 'Headshots available:\n' + HEADSHOTS.map(function (h) {
            return '  - <a href="' + h.url + '" target="_blank" rel="noopener">' + h.url + '</a> <span class="muted">(' + h.note + ')</span>';
          }).join('\n');
        } },
        '/help': { desc: 'List available commands', instant: true, run: function (body) {
          body.innerHTML = Object.keys(COMMANDS).map(function (k) {
            return '<span class="cmd">' + k + '</span>' + ' '.repeat(10 - k.length) + '<span class="muted">' + COMMANDS[k].desc + '</span>';
          }).join('\n');
        } },
        '/clear': { desc: 'Clear the screen', silent: true, run: function () { log.innerHTML = ''; } }
      };

      var input = document.getElementById('input');
      var typed = document.getElementById('typed');
      var ph = document.getElementById('ph');
      var menu = document.getElementById('menu');
      var hint = document.getElementById('hint');
      var history = [], hIndex = 0, sel = 0, busy = false;

      function tpl(id) { return document.getElementById(id).content.cloneNode(true); }
      function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      function bottom() { window.scrollTo(0, document.body.scrollHeight); }
      function matches() {
        var v = input.value;
        if (v[0] !== '/' || v.indexOf(' ') !== -1) return [];
        return Object.keys(COMMANDS).filter(function (k) { return k.indexOf(v) === 0; });
      }

      function render() {
        // The drawn cursor always sits at the end, so keep the real caret there too.
        var n = input.value.length;
        if (input.selectionStart !== n) input.setSelectionRange(n, n);
        typed.textContent = input.value;
        ph.hidden = n > 0;
        var m = matches();
        menu.hidden = !m.length;
        if (m.length) {
          sel = Math.min(sel, m.length - 1);
          menu.innerHTML = m.map(function (k, i) {
            return '<div class="row' + (i === sel ? ' sel' : '') + '"><span class="name">' + k + '</span><span>' + COMMANDS[k].desc + '</span></div>';
          }).join('');
        }
        hint.textContent = n ? '' : '? for shortcuts';
      }

      // Status line: connection, browser, language and time on the page, all read in the browser (nothing is sent anywhere).
      var status = document.getElementById('status');
      var ua = navigator.userAgent;
      var browser = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Firefox|FxiOS/.test(ua) ? 'Firefox'
        : /Chrome|CriOS/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : '';
      var started = Date.now();
      function uptime() {
        var t = Math.floor((Date.now() - started) / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60;
        return 'up ' + (h ? h + 'h ' : '') + (h || m ? m + 'm ' : '') + (t % 60) + 's';
      }
      function tick() {
        var net = navigator.onLine
          ? '<span class="on">●</span> online'
          : '<span class="off">●</span> offline';
        status.innerHTML = [net, browser, navigator.language, uptime()].filter(Boolean).join(' · ');
      }
      tick();
      setInterval(tick, 1000);
      window.addEventListener('online', tick);
      window.addEventListener('offline', tick);

      function entry(text) {
        var e = document.createElement('div');
        e.className = 'entry';
        e.innerHTML = '<div class="echo">' + esc(text) + '</div>';
        log.appendChild(e);
        return e;
      }
      function reply(e, err) {
        var r = document.createElement('div');
        r.className = 'reply';
        r.innerHTML = '<span class="dot' + (err ? ' err' : '') + '">⏺</span><div class="body"></div>';
        e.appendChild(r);
        return r.querySelector('.body');
      }

      // Claude Code–style spinner shown briefly before a reply
      function think(e, ms) {
        e.dataset.start = Date.now();
        var frames = ['·', '✢', '✳', '✶', '✻', '✽', '✻', '✶', '✳', '✢'];
        var words = [['Thinking…', 'Thought'], ['Recollecting…', 'Recollected'], ['Pondering…', 'Pondered'], ['Reminiscing…', 'Reminisced']];
        var pick = words[Math.floor(Math.random() * words.length)], word = pick[0];
        e.dataset.verb = pick[1];
        var s = document.createElement('div');
        s.className = 'spinner';
        e.appendChild(s);
        var i = 0;
        function frame() { s.innerHTML = frames[i++ % frames.length] + ' ' + word + ' <span class="hint">(esc to interrupt)</span>'; }
        frame();
        var t = setInterval(frame, 110);
        bottom();
        return new Promise(function (done) { setTimeout(function () { clearInterval(t); s.remove(); done(); }, ms); });
      }

      // Type a fragment out character by character, keeping its links and paragraphs intact.
      function stream(body, frag) {
        body.appendChild(frag);
        var walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT), nodes = [], node;
        while ((node = walker.nextNode())) {
          var text = node.textContent.replace(/\s+/g, ' ');
          if (!text.trim()) { node.textContent = ''; continue; }
          nodes.push({ node: node, text: node.previousSibling ? text : text.replace(/^ /, '') });
          node.textContent = '';
        }
        var ni = 0, ci = 0;
        return new Promise(function (done) {
          (function tick() {
            for (var k = 0; k < 5 && ni < nodes.length; k++) {
              var cur = nodes[ni];
              cur.node.textContent += cur.text[ci++];
              if (ci >= cur.text.length) { ni++; ci = 0; }
            }
            bottom();
            if (ni < nodes.length) requestAnimationFrame(tick); else done();
          })();
        });
      }

      function submit(raw) {
        var text = raw.trim();
        if (!text || busy) return;
        history.push(text); hIndex = history.length;
        var cmd = COMMANDS[text.split(/\s+/)[0]];
        if (cmd && cmd.silent) { cmd.run(); return; }
        var e = entry(text);
        if (!cmd) {
          reply(e, true).innerHTML = text[0] === '/'
            ? 'Unknown command: ' + esc(text) + '. Type <span class="cmd">/help</span> to see what’s available.'
            : 'I only answer a few commands here. Try <span class="cmd">/bio</span>.';
          bottom();
          return;
        }
        busy = true;
        Promise.resolve(cmd.instant ? null : think(e, 700))
          .then(function () { return cmd.run(reply(e)); })
          .then(function () {
            if (cmd.instant) { busy = false; bottom(); return; }
            var d = document.createElement('div');
            d.className = 'done';
            d.textContent = '✻ ' + e.dataset.verb + ' for ' + Math.max(1, Math.round((Date.now() - e.dataset.start) / 1000)) + 's';
            e.appendChild(d);
            busy = false; bottom();
          });
      }

      input.addEventListener('input', function () { sel = 0; render(); });
      input.addEventListener('keydown', function (ev) {
        var m = matches();
        if (ev.key === 'Enter') {
          ev.preventDefault();
          var v = m.length ? m[sel] : input.value;
          input.value = '';
          render();
          submit(v);
        } else if (ev.key === 'Tab' && m.length) {
          ev.preventDefault();
          input.value = m[sel]; render();
        } else if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
          ev.preventDefault();
          var d = ev.key === 'ArrowUp' ? -1 : 1;
          if (m.length) { sel = (sel + d + m.length) % m.length; render(); return; }
          hIndex = Math.max(0, Math.min(history.length, hIndex + d));
          input.value = history[hIndex] || ''; render();
        } else if (ev.key === 'Escape') {
          input.value = ''; render();
        } else if (ev.key === 'l' && ev.ctrlKey) {
          ev.preventDefault(); log.innerHTML = '';
        } else if (ev.key === 'ArrowLeft' || ev.key === 'Home') {
          ev.preventDefault();
        }
      });
      // Clicking anywhere (except a link, or after selecting text) puts focus back in the prompt.
      document.addEventListener('click', function (ev) {
        if (ev.target.closest('a') || String(window.getSelection())) return;
        input.focus();
      });
      menu.addEventListener('mousedown', function (ev) {
        var row = ev.target.closest('.row');
        if (!row) return;
        ev.preventDefault();
        input.value = row.querySelector('.name').textContent; render(); input.focus();
      });

      render();
      input.focus();
    })();
  </script>
</body>
</html>
