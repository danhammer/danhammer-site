<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dan Hammer</title>
  <meta name="description" content="Dan Hammer — environmental data science.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="icon" href="../r/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* Always dark, like Claude Code's dark theme: very dark grey, not black. */
    :root {
      --bg: #1e1e1e;
      --fg: #e4e4e4;
      --dim: #8b8b8b;
      --faint: #5c5c5c;
      --accent: #d77757;   /* Claude orange */
      --link: #8ab4f8;
      --border: #5c5c5c;
      --select: #b1b9f9;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body {
      color: var(--fg);
      font: 400 15px/1.55 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
    ::selection { background: #3a4a6b; }

    .term {
      max-width: 920px;
      padding: 20px 16px 40vh;
    }

    /* Welcome box */
    .welcome {
      display: inline-block;
      max-width: 100%;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 18px;
      margin-bottom: 18px;
    }
    .welcome p { margin: 0; }
    .welcome .star { color: var(--accent); }
    .welcome .sub { margin: 10px 0 0 2ch; color: var(--dim); font-style: italic; }
    .welcome .sub + .sub { margin-top: 2px; }
    .tips { color: var(--dim); margin: 0 0 22px 1ch; }
    .tips p { margin: 0; }
    .tips b { color: var(--fg); font-weight: 400; }

    /* Transcript */
    .entry { margin: 0 0 18px; }
    .echo { color: var(--dim); white-space: pre-wrap; word-break: break-word; }
    .echo::before { content: "> "; }
    .reply { display: flex; gap: 1ch; margin-top: 6px; }
    .reply .dot { flex: none; color: var(--fg); }
    .reply .dot.err { color: #e06c75; }
    .reply .body { min-width: 0; white-space: pre-wrap; word-break: break-word; }
    .reply .body p { margin: 0 0 .9em; white-space: normal; }
    .reply .body p:last-child { margin: 0; }
    .muted { color: var(--dim); }
    .cmd { color: var(--select); }

    .spinner { color: var(--accent); margin-top: 6px; }
    .spinner .hint { color: var(--dim); }

    /* Prompt box */
    .prompt {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      gap: 1ch;
      cursor: text;
    }
    .prompt .sign { flex: none; }
    .line { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-all; }
    .placeholder { color: var(--faint); }
    .cursor {
      display: inline-block;
      width: 1ch;
      height: 1.2em;
      vertical-align: text-bottom;
      background: var(--fg);
      animation: blink 1.06s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    /* The real input sits invisibly over the box, so mobile keyboards and IME still work */
    #input {
      position: absolute;
      inset: 0;
      width: 100%;
      opacity: 0;
      border: 0;
      font: inherit;
      background: transparent;
    }
    .footer-hint { color: var(--dim); font-size: 13px; margin: 6px 0 0 2ch; min-height: 1.5em; }

    /* Slash-command menu */
    .menu { margin: 6px 0 0 2ch; }
    .menu .row { display: flex; gap: 3ch; color: var(--dim); cursor: pointer; }
    .menu .row .name { min-width: 10ch; }
    .menu .row.sel { color: var(--select); }

    @media (max-width: 520px) {
      body { font-size: 13.5px; }
    }
  </style>
</head>
<body>
  <div class="term">
    <div class="welcome">
      <p><span class="star">✻</span> Welcome to <b>Dan Hammer</b>’s terminal</p>
      <p class="sub">/help for commands</p>
      <p class="sub">cwd: ~/danhammer</p>
    </div>

    <div class="tips">
      <p>Tips for getting started:</p>
      <p>1. Type <b>/bio</b> for a short bio</p>
      <p>2. Type <b>/</b> to see every command</p>
    </div>

    <div id="log" aria-live="polite"></div>

    <div class="prompt">
      <span class="sign">&gt;</span>
      <div class="line" aria-hidden="true"><span id="typed"></span><span class="cursor"></span><span id="ph" class="placeholder">Try "/bio"</span></div>
      <input id="input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command">
    </div>
    <div class="menu" id="menu" hidden></div>
    <div class="footer-hint" id="hint">? for shortcuts</div>
  </div>

  <!-- Content printed by commands. To add one (e.g. /headshot, /cv), add a template and an entry in COMMANDS. -->
  <template id="bio">
    <p>Dr. Dan Hammer is a Managing Partner at <a href="https://ode.partners">Ode</a>, a tech and design agency for the environment. He is the winner of the inaugural <a href="https://www.ioes.ucla.edu/pritzker-genius/">Pritzker Environmental Genius Award</a>; a member of the Brain Trust at XPRIZE; and a Senior Technical Advisor at Earth Alliance.</p>
    <p>Dan earned his PhD in environmental economics from U.C. Berkeley, where he was a Fellow at the Berkeley Institute for Data Science and won the 2019 <a href="https://alumni.berkeley.edu/announcements/caa-announcements/passing-gift-transformation-2019-berkeley-charter-gala">Mark Bingham Prize for Excellence by a Young Alumnus</a>. He previously served as a Senior Policy Advisor in the Obama White House and a Presidential Innovation Fellow at NASA.</p>
    <p>Dan was the Chief Data Scientist at the World Resources Institute, where he co-founded <a href="https://www.globalforestwatch.org">Global Forest Watch</a>. He has been a National Geographic Fellow and a lead math instructor at San Quentin State Prison with the Prison University Project. Dan graduated with high honors in mathematics and economics from Swarthmore College, where he was a Lang Opportunity Scholar and a Watson Fellow.</p>
  </template>

  <script>
    (function () {
      var log = document.getElementById('log');

      // name -> { desc, run(body) }. `instant` skips the thinking spinner; `silent` prints no transcript entry.
      var COMMANDS = {
        '/bio': { desc: 'Print a short bio', run: function (body) { return stream(body, tpl('bio')); } },
        '/help': { desc: 'List available commands', instant: true, run: function (body) {
          body.innerHTML = Object.keys(COMMANDS).map(function (k) {
            return '<span class="cmd">' + k + '</span>' + ' '.repeat(10 - k.length) + '<span class="muted">' + COMMANDS[k].desc + '</span>';
          }).join('\n');
        } },
        '/clear': { desc: 'Clear the screen', silent: true, run: function () { log.innerHTML = ''; } }
      };

      var input = document.getElementById('input');
      var typed = document.getElementById('typed');
      var ph = document.getElementById('ph');
      var menu = document.getElementById('menu');
      var hint = document.getElementById('hint');
      var history = [], hIndex = 0, sel = 0, busy = false;

      function tpl(id) { return document.getElementById(id).content.cloneNode(true); }
      function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      function bottom() { window.scrollTo(0, document.body.scrollHeight); }
      function matches() {
        var v = input.value;
        if (v[0] !== '/' || v.indexOf(' ') !== -1) return [];
        return Object.keys(COMMANDS).filter(function (k) { return k.indexOf(v) === 0; });
      }

      function render() {
        // The drawn cursor always sits at the end, so keep the real caret there too.
        var n = input.value.length;
        if (input.selectionStart !== n) input.setSelectionRange(n, n);
        typed.textContent = input.value;
        ph.hidden = n > 0;
        var m = matches();
        menu.hidden = !m.length;
        if (m.length) {
          sel = Math.min(sel, m.length - 1);
          menu.innerHTML = m.map(function (k, i) {
            return '<div class="row' + (i === sel ? ' sel' : '') + '"><span class="name">' + k + '</span><span>' + COMMANDS[k].desc + '</span></div>';
          }).join('');
        }
        hint.textContent = n ? '' : '? for shortcuts';
      }

      function entry(text) {
        var e = document.createElement('div');
        e.className = 'entry';
        e.innerHTML = '<div class="echo">' + esc(text) + '</div>';
        log.appendChild(e);
        return e;
      }
      function reply(e, err) {
        var r = document.createElement('div');
        r.className = 'reply';
        r.innerHTML = '<span class="dot' + (err ? ' err' : '') + '">⏺</span><div class="body"></div>';
        e.appendChild(r);
        return r.querySelector('.body');
      }

      // Claude Code–style spinner shown briefly before a reply
      function think(e, ms) {
        var frames = ['·', '✢', '✳', '✶', '✻', '✽', '✻', '✶', '✳', '✢'];
        var words = ['Thinking…', 'Recollecting…', 'Pondering…', 'Reminiscing…'];
        var word = words[Math.floor(Math.random() * words.length)];
        var s = document.createElement('div');
        s.className = 'spinner';
        e.appendChild(s);
        var i = 0;
        function frame() { s.innerHTML = frames[i++ % frames.length] + ' ' + word + ' <span class="hint">(esc to interrupt)</span>'; }
        frame();
        var t = setInterval(frame, 110);
        bottom();
        return new Promise(function (done) { setTimeout(function () { clearInterval(t); s.remove(); done(); }, ms); });
      }

      // Type a fragment out character by character, keeping its links and paragraphs intact.
      function stream(body, frag) {
        body.appendChild(frag);
        var walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT), nodes = [], node;
        while ((node = walker.nextNode())) {
          var text = node.textContent.replace(/\s+/g, ' ');
          if (!text.trim()) { node.textContent = ''; continue; }
          nodes.push({ node: node, text: node.previousSibling ? text : text.replace(/^ /, '') });
          node.textContent = '';
        }
        var ni = 0, ci = 0;
        return new Promise(function (done) {
          (function tick() {
            for (var k = 0; k < 5 && ni < nodes.length; k++) {
              var cur = nodes[ni];
              cur.node.textContent += cur.text[ci++];
              if (ci >= cur.text.length) { ni++; ci = 0; }
            }
            bottom();
            if (ni < nodes.length) requestAnimationFrame(tick); else done();
          })();
        });
      }

      function submit(raw) {
        var text = raw.trim();
        if (!text || busy) return;
        history.push(text); hIndex = history.length;
        var cmd = COMMANDS[text.split(/\s+/)[0]];
        if (cmd && cmd.silent) { cmd.run(); return; }
        var e = entry(text);
        if (!cmd) {
          reply(e, true).innerHTML = text[0] === '/'
            ? 'Unknown command: ' + esc(text) + '. Type <span class="cmd">/help</span> to see what’s available.'
            : 'I only answer a few commands here. Try <span class="cmd">/bio</span>.';
          bottom();
          return;
        }
        busy = true;
        Promise.resolve(cmd.instant ? null : think(e, 700))
          .then(function () { return cmd.run(reply(e)); })
          .then(function () { busy = false; bottom(); });
      }

      input.addEventListener('input', function () { sel = 0; render(); });
      input.addEventListener('keydown', function (ev) {
        var m = matches();
        if (ev.key === 'Enter') {
          ev.preventDefault();
          var v = m.length ? m[sel] : input.value;
          input.value = '';
          render();
          submit(v);
        } else if (ev.key === 'Tab' && m.length) {
          ev.preventDefault();
          input.value = m[sel]; render();
        } else if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
          ev.preventDefault();
          var d = ev.key === 'ArrowUp' ? -1 : 1;
          if (m.length) { sel = (sel + d + m.length) % m.length; render(); return; }
          hIndex = Math.max(0, Math.min(history.length, hIndex + d));
          input.value = history[hIndex] || ''; render();
        } else if (ev.key === 'Escape') {
          input.value = ''; render();
        } else if (ev.key === 'l' && ev.ctrlKey) {
          ev.preventDefault(); log.innerHTML = '';
        } else if (ev.key === 'ArrowLeft' || ev.key === 'Home') {
          ev.preventDefault();
        }
      });
      // Clicking anywhere (except a link, or after selecting text) puts focus back in the prompt.
      document.addEventListener('click', function (ev) {
        if (ev.target.closest('a') || String(window.getSelection())) return;
        input.focus();
      });
      menu.addEventListener('mousedown', function (ev) {
        var row = ev.target.closest('.row');
        if (!row) return;
        ev.preventDefault();
        input.value = row.querySelector('.name').textContent; render(); input.focus();
      });

      render();
      input.focus();
    })();
  </script>
</body>
</html>
