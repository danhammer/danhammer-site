<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Dan Hammer</title>

  <link rel="icon" href="favicon.ico">
  <style>
    /* Always dark: Claude Code's palette in the VS Code terminal. */
    :root {
      --bg: #1e1e1e;
      --fg: #cccccc;
      --dim: #999999;
      --rule: #888888;
      --accent: #d77757;   /* Claude orange, for the active spinner */
      --lavender: #b3b9f4;
      --err: #e06c75;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
    body {
      color: var(--fg);
      /* Console-sized type: fixed, never scales up with the window */
      font: 400 11.7px/1.3 Menlo, Monaco, "DejaVu Sans Mono", Consolas, "Liberation Mono", monospace;
    }
    a { color: var(--lavender); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 2px; }
    ::selection { background: #264f78; }

    /* The terminal fills the visible frame (--vh tracks it as mobile keyboards open and close). The transcript
       grows and pushes the prompt down until the prompt is 80% of the way down; after that the prompt stays put
       and the transcript scrolls above it. */
    .term {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--vh, 100dvh);
      padding-top: 16px;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .scroll {
      flex: 0 1 auto; min-height: 0;
      max-height: calc(var(--vh, 100dvh) * 0.8 - 16px);
      overflow-y: auto; overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    .dock { flex: none; position: relative; }
    .pad { padding: 0 16px; }

    /* ASCII banner (figlet "ICL-1900": the name punched into a computer card, beside a holes-only card for "Be kind, be kind, be kind"), printed top to bottom on load */
    .banner { margin: 0 0 1.25em; font-weight: 400; font-size: inherit; color: var(--accent); }
    .banner pre { margin: 0; font: inherit; line-height: 1.15; font-size: min(1em, calc((100vw - 32px) / 46 / 0.61)); }
    .banner .name { color: #fff; }
    .banner pre { overflow: hidden; }
    .banner .hole { transition: color .5s ease; }
    .banner .hole.seed { color: #fff; transition: color 2s ease; cursor: pointer; }

    /* Transcript */
    .entry { margin: 0 0 1.25em; }
    .echo { color: var(--dim); white-space: pre-wrap; word-break: break-word; }
    .echo::before { content: "❯ "; }
    .reply { margin-top: 1.25em; padding-left: 2ch; }
    .done { color: var(--dim); margin-top: 1.25em; }
    .reply .body { min-width: 0; white-space: pre-wrap; word-break: break-word; }
    .reply .body p { margin: 0 0 1.25em; white-space: normal; }
    .reply .body p:last-child { margin: 0; }
    .muted { color: var(--dim); }
    .cmd { color: var(--lavender); }
    .group + .group { margin-top: 1.25em; }
    .reply .body .group p { margin: 0; }
    .group.awards .row { grid-template-columns: 10ch minmax(0, 1fr); gap: 2ch; margin-bottom: 0; }
    .group.awards .row span:last-child { color: inherit; }
    .group.awards .yr { color: var(--dim); }
    .group.misc .row { grid-template-columns: 1ch minmax(0, 1fr); gap: 1ch; }
    .group.pubs .row { grid-template-columns: 4ch minmax(0, 1fr); margin-bottom: .6em; }
    .group.pubs b { color: var(--fg); }
    .group .row { display: grid; grid-template-columns: minmax(0, 34ch) minmax(0, 1fr); gap: 2ch; white-space: normal; }
    @media (max-width: 640px) {
      .group .row { grid-template-columns: 1fr; gap: 0; margin-bottom: .4em; }
      .group .row span:last-child { color: var(--dim); }
    }

    .spinner { color: var(--accent); margin-top: 1.25em; }
    .spinner .hint { color: var(--dim); }

    /* Prompt box */
    .prompt {
      position: relative;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      padding: 6px 16px;
      display: flex;
      gap: 1ch;
      cursor: text;
    }
    .prompt .sign { flex: none; }
    .line { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-all; }
    .placeholder { color: var(--dim); }
    .cursor {
      display: inline-block;
      width: 1ch;
      height: 1.2em;
      vertical-align: text-bottom;
      background: var(--fg);
      animation: blink 1.06s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    /* The real input sits invisibly over the box, so mobile keyboards and IME still work */
    #input {
      position: absolute;
      inset: 0;
      width: 100%;
      opacity: 0;
      border: 0;
      font: inherit;
      font-size: 16px;  /* invisible; 16px stops iOS zooming the page on focus */
      background: transparent;
    }
    .footer-hint { color: var(--dim); margin: 4px 0 0; padding: 0 16px 0 calc(16px + 2ch); min-height: 1.25em; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 2ch; }
    .footer-hint .status { margin-left: auto; text-align: right; }
    .footer-hint .on { color: #5cc9cb; }
    .footer-hint .off { color: var(--err); }

    /* Slash-command menu: floats over the status line (or, if there's no room below, over the transcript above
       the prompt) so opening it never moves the prompt. */
    .menu { position: absolute; left: 0; right: 0; z-index: 1; background: var(--bg); padding: 4px 16px 0 calc(16px + 2ch); }
    .menu.up { bottom: 100%; padding: 0 16px 4px calc(16px + 2ch); }
    .menu .row { display: flex; gap: 3ch; color: var(--dim); cursor: pointer; }
    .menu .row .name { min-width: 15ch; }
    .menu .row.sel { color: var(--lavender); }

    @media (max-width: 520px) {
      body { font-size: 10.8px; }
    }
  </style>
</head>

  <template id="bio">
    <p>Dan Hammer is co-founder of <a href="https://lgnd.io/">LGND</a>, which builds AI infrastructure that makes Earth observation data searchable and actionable for people and AI agents, and co-founder of <a href="https://madewithclay.org/">Clay</a>, the open-source foundation model for Earth, where he now serves as Creative Technologist focused on public-interest applications. He is a Fellow at <a href="https://www.renaissancephilanthropy.org/">Renaissance Philanthropy</a> and co-founder of <a href="https://ode.partners">Ode</a>, a design and technology agency for environmental organizations whose work has earned multiple <a href="https://winners.webbyawards.com/2024/websites-and-mobile-sites/general-desktop-mobile-sites/sustainability-environment/287895/oceans-futures--wwf">Webby</a> and Anthem Awards.</p>
    <p>Earlier, Dan served as Chief Data Scientist at the World Resources Institute, where he helped build the first versions of <a href="https://news.berkeley.edu/?p=65111">Global Forest Watch</a>, as a Senior Policy Advisor in the White House Office of Science and Technology Policy, as a <a href="https://news.berkeley.edu/2014/12/04/dan-hammer-presidential-innovation-fellow/">Presidential Innovation Fellow at NASA</a>, and as a <a href="https://www.ioes.ucla.edu/person/dan-hammer">Senior Advisor at Google X</a>. He has taught as an adjunct at UC Berkeley and Georgetown.</p>
    <p>Dan is a <a href="https://www.nationalgeographic.org/find-explorers/dan-hammer">National Geographic Explorer</a>, winner of the inaugural <a href="https://www.ioes.ucla.edu/article/dan-hammer-wins-inaugural-pritzker-award/">Pritzker Emerging Environmental Genius Award</a>, and recipient of UC Berkeley’s <a href="https://nature.berkeley.edu/news/2019/03/alumnus-dan-hammer-wins-mark-bingham-award">Mark Bingham Award</a>. He holds a PhD and an MS in environmental economics from <a href="https://www.berkeley.edu/">UC Berkeley</a> and a BA with high honors in mathematics and economics from <a href="https://www.swarthmore.edu/living-liberal-arts/dan-hammer-07">Swarthmore College</a>, where he was a Lang Scholar and Watson Fellow.</p>
  </template>

  <script>
    // Print the banner in line by line, top to bottom.
    (function () {
      var art = "Dan Hammer, Ph.D.\n**  **  * *  ****    **  * ** **  * ** **  * *\n  *   ** *  *           * *      * *      * *\n\n *   *\n                     *  *     *  *     *  *\n              * *\n*     **       *           *        *        *\n  *     *             *   *    *   *    *   *\n          *                 *        *\n            *\n    *     *  ** *           *        *\n         *               *        *        *".split('\n');
      var el = document.getElementById('banner');
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // The "Be kind" card starts at column 21 (17-column name card + 4 spaces). Its first 9 columns
      // punch "Be kind, ", so repeat them to fill the window's width (measured once, on load).
      var KIND = 21, UNIT = 9;
      var probe = document.createElement('span');
      probe.textContent = '0000000000';
      el.appendChild(probe);
      var cols = Math.floor(el.clientWidth / (probe.getBoundingClientRect().width / 10));
      el.removeChild(probe);
      var width = Math.max.apply(null, art.map(function (l) { return l.length; }));
      if (cols > width) {
        art = art.map(function (l, r) {
          if (r === 0) return l;
          var unit = (l + ' '.repeat(width)).slice(KIND, KIND + UNIT), tail = '';
          while (tail.length < cols - KIND) tail += unit;
          return ((l + ' '.repeat(width)).slice(0, KIND) + tail.slice(0, cols - KIND)).replace(/\s+$/, '');
        });
      }

      function esc(ch) { return ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch; }
      // Row 0 is the name, always white; with `spans`, every hole gets its own element.
      function line(l, r, spans) {
        if (r === 0) return '<span class="name">' + l.split('').map(esc).join('') + '</span>';
        if (!spans) return l;
        var html = '';
        for (var c = 0; c < l.length; c++) {
          html += l[c] === '*' ? '<span class="hole" data-r="' + r + '" data-c="' + c + '">*</span>' : esc(l[c]);
        }
        return html;
      }
      // Pad unprinted rows with a space so the layout below doesn't jump as rows appear.
      function show(rows, spans) {
        el.innerHTML = art.map(function (l, r) { return r < rows ? line(l, r, spans) : ' '; }).join('\n');
      }

      // Once printed, fade one of the name card's holes to white. Clicking the white hole washes the others
      // into a rainbow rippling outward from it; clicking again ripples back.
      function holes() {
        show(art.length, true);
        var spans = Array.prototype.slice.call(el.querySelectorAll('.hole'));
        // The white hole is always one of the name card's (columns before the gap), below its top row of holes.
        var mine = spans.filter(function (h) { return +h.dataset.c < KIND - 4 && +h.dataset.r >= 2; });
        var seed = mine[Math.floor(Math.random() * mine.length)];
        var r0 = +seed.dataset.r, c0 = +seed.dataset.c, rainbow = false;
        // Distance in character widths; a line is about twice as tall as a character is wide.
        spans.forEach(function (h) {
          h.dist = Math.hypot(+h.dataset.c - c0, (+h.dataset.r - r0) * 1.9);
        });
        var max = Math.max.apply(null, spans.map(function (h) { return h.dist; })) || 1;
        setTimeout(function () { seed.classList.add('seed'); }, still ? 0 : 400);
        seed.addEventListener('click', function () {
          rainbow = !rainbow;
          spans.forEach(function (h) {
            if (h === seed) return;
            h.style.transitionDelay = still ? '0s' : Math.round(h.dist / max * 1500) + 'ms';
            h.style.color = rainbow ? 'hsl(' + Math.round(h.dist / max * 300) + ', 85%, 65%)' : '';
          });
        });
      }

      if (still) { show(art.length); holes(); return; }
      var row = 0;
      show(0);
      var t = setInterval(function () {
        show(++row);
        if (row >= art.length) { clearInterval(t); holes(); }
      }, 90);
    })();

    (function () {
      var log = document.getElementById('log');

      // Files live in r/headshots/; add a line here when you add one.
      var HEADSHOTS = [
        { url: 'https://danham.me/r/headshots/profile_color.jpg', note: 'color, 1250×1250' },
        { url: 'https://danham.me/r/headshots/profile_bw.jpg', note: 'black & white, 2000×2000' }
      ];

      // name -> { desc, run(body) }. `instant` skips the thinking spinner; `silent` prints no transcript entry.
      var COMMANDS = {
        '/bio': { desc: 'Print a short bio', run: function (body) { return stream(body, tpl('bio')); } },
        '/work': { desc: 'List places I have worked', run: function (body) { return stream(body, tpl('work')); } },
        '/awards': { desc: 'List awards and honors', run: function (body) { return stream(body, tpl('awards')); } },
        '/misc': { desc: 'Paddling, cubing, and other facts', run: function (body) { return stream(body, tpl('misc')); } },
        '/publications': { desc: 'List peer-reviewed publications', run: function (body) { return stream(body, tpl('publications')); } },
        '/cv': { desc: 'Link to my CV (PDF)', run: function (body) {
          body.innerHTML = 'Click to open my CV: <a href="https://danham.me/r/cv.pdf" target="_blank" rel="noopener">https://danham.me/r/cv.pdf</a>';
        } },
        '/headshot': { desc: 'List headshot image URLs', run: function (body) {
          body.innerHTML = 'Headshots available:\n' + HEADSHOTS.map(function (h) {
            return '  - <a href="' + h.url + '" target="_blank" rel="noopener">' + h.url + '</a> <span class="muted">(' + h.note + ')</span>';
          }).join('\n');
        } },
        '/help': { desc: 'List available commands', instant: true, run: function (body) {
          body.innerHTML = Object.keys(COMMANDS).map(function (k) {
            return '<span class="cmd">' + k + '</span>' + ' '.repeat(Math.max(1, 15 - k.length)) + '<span class="muted">' + COMMANDS[k].desc + '</span>';
          }).join('\n');
        } },
        '/clear': { desc: 'Clear the screen', silent: true, run: function () { log.innerHTML = ''; } }
      };

      var input = document.getElementById('input');
      var typed = document.getElementById('typed');
      var ph = document.getElementById('ph');
      var menu = document.getElementById('menu');
      var hint = document.getElementById('hint');
      var history = [], hIndex = 0, sel = 0, busy = false;

      function tpl(id) { return document.getElementById(id).content.cloneNode(true); }
      function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      // Follow the newest text while the reader is at the bottom; if they scroll up to reread, leave them there
      // until they scroll back down. A new command always jumps to the bottom.
      var scroll = document.getElementById('scroll'), stuck = true;
      function bottom(force) {
        if (force || stuck) { scroll.scrollTop = scroll.scrollHeight; stuck = true; }
      }
      scroll.addEventListener('scroll', function () {
        stuck = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 4;
      });
      new ResizeObserver(function () { bottom(); }).observe(scroll);
      // The wheel scrolls the transcript even when the pointer is over the prompt.
      document.addEventListener('wheel', function (ev) {
        if (!scroll.contains(ev.target)) scroll.scrollTop += ev.deltaY;
      }, { passive: true });

      // Size the terminal to the visible frame, which shrinks when a mobile keyboard opens.
      var term = document.getElementById('term'), vv = window.visualViewport;
      function fit() {
        if (!vv) return;
        document.documentElement.style.setProperty('--vh', vv.height + 'px');
        term.style.transform = vv.offsetTop ? 'translateY(' + vv.offsetTop + 'px)' : '';
      }
      if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit(); }
      function matches() {
        var v = input.value;
        if (v[0] !== '/' || v.indexOf(' ') !== -1) return [];
        return Object.keys(COMMANDS).filter(function (k) { return k.indexOf(v) === 0; });
      }

      function render() {
        // The drawn cursor always sits at the end, so keep the real caret there too.
        var n = input.value.length;
        if (input.selectionStart !== n) input.setSelectionRange(n, n);
        typed.textContent = input.value;
        ph.hidden = n > 0;
        var m = matches();
        menu.hidden = !m.length;
        if (m.length) {
          sel = Math.min(sel, m.length - 1);
          menu.innerHTML = m.map(function (k, i) {
            return '<div class="row' + (i === sel ? ' sel' : '') + '"><span class="name">' + k + '</span><span>' + COMMANDS[k].desc + '</span></div>';
          }).join('');
          menu.classList.remove('up');
          if (menu.getBoundingClientRect().bottom > term.getBoundingClientRect().bottom) menu.classList.add('up');
        }
        hint.textContent = n ? '' : '? for commands';
      }

      // Status line: connection, browser, approximate location and time on the page.
      var status = document.getElementById('status');
      var ua = navigator.userAgent;
      var browser = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Firefox|FxiOS/.test(ua) ? 'Firefox'
        : /Chrome|CriOS/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : '';
      var started = Date.now();

      // Approximate city from the visitor's IP via iplocate.io (free, no key), with a note on the kind of
      // connection when it's anything but a plain ISP. Until it answers, or if it fails or is blocked, show the
      // browser's time zone instead.
      var STATES = { Alabama: 'AL', Alaska: 'AK', Arizona: 'AZ', Arkansas: 'AR', California: 'CA', Colorado: 'CO',
        Connecticut: 'CT', Delaware: 'DE', 'District of Columbia': 'DC', Florida: 'FL', Georgia: 'GA', Hawaii: 'HI',
        Idaho: 'ID', Illinois: 'IL', Indiana: 'IN', Iowa: 'IA', Kansas: 'KS', Kentucky: 'KY', Louisiana: 'LA',
        Maine: 'ME', Maryland: 'MD', Massachusetts: 'MA', Michigan: 'MI', Minnesota: 'MN', Mississippi: 'MS',
        Missouri: 'MO', Montana: 'MT', Nebraska: 'NE', Nevada: 'NV', 'New Hampshire': 'NH', 'New Jersey': 'NJ',
        'New Mexico': 'NM', 'New York': 'NY', 'North Carolina': 'NC', 'North Dakota': 'ND', Ohio: 'OH',
        Oklahoma: 'OK', Oregon: 'OR', Pennsylvania: 'PA', 'Rhode Island': 'RI', 'South Carolina': 'SC',
        'South Dakota': 'SD', Tennessee: 'TN', Texas: 'TX', Utah: 'UT', Vermont: 'VT', Virginia: 'VA',
        Washington: 'WA', 'West Virginia': 'WV', Wisconsin: 'WI', Wyoming: 'WY', 'Puerto Rico': 'PR' };
      var place = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      try {
        var ctl = new AbortController();
        setTimeout(function () { ctl.abort(); }, 4000);
        fetch('https://iplocate.io/api/lookup', { signal: ctl.signal })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (g) {
            if (!g || !g.city) return;
            var where = g.country_code === 'US' ? STATES[g.subdivision] || g.subdivision : g.country;
            var note = connection(g);
            place = '~' + g.city + (where ? ', ' + where : '') + (note ? ' (' + note + ')' : '');
            tick();
          })
          .catch(function () {});
      } catch (e) {}
      // The most telling thing about the connection, or '' for an ordinary ISP.
      function connection(g) {
        var p = g.privacy || {}, co = g.company || {};
        if (p.is_tor) return 'Tor';
        if (p.is_vpn) return 'VPN';
        if (p.is_icloud_relay) return 'iCloud Private Relay';
        if (p.is_proxy) return 'proxy';
        if (p.is_hosting) return 'data center';
        if (g.is_satellite) return 'satellite';
        // e.g. a gym's or office's Wi-Fi: "business: Equinox"
        if (co.type && co.type !== 'isp') return co.type + (co.name ? ': ' + co.name : '');
        return '';
      }
      function uptime() {
        var t = Math.floor((Date.now() - started) / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60;
        return 'up ' + (h ? h + 'h ' : '') + (h || m ? m + 'm ' : '') + (t % 60) + 's';
      }
      function tick() {
        var net = navigator.onLine
          ? '<span class="on">●</span> online'
          : '<span class="off">●</span> offline';
        status.innerHTML = [net, browser, esc(place)].filter(Boolean).join(' · ') + '<br>' + uptime();
      }
      tick();
      setInterval(tick, 1000);
      window.addEventListener('online', tick);
      window.addEventListener('offline', tick);

      function entry(text) {
        var e = document.createElement('div');
        e.className = 'entry';
        e.innerHTML = '<div class="echo">' + esc(text) + '</div>';
        log.appendChild(e);
        return e;
      }
      function reply(e) {
        var r = document.createElement('div');
        r.className = 'reply';
        r.innerHTML = '<div class="body"></div>';
        e.appendChild(r);
        return r.querySelector('.body');
      }

      // Claude Code–style spinner shown briefly before a reply
      function think(e, ms) {
        e.dataset.start = Date.now();
        var frames = ['·', '✢', '✳', '✶', '✻', '✽', '✻', '✶', '✳', '✢'];
        var words = [['Thinking…', 'Thought'], ['Recollecting…', 'Recollected'], ['Pondering…', 'Pondered'], ['Reminiscing…', 'Reminisced']];
        var pick = words[Math.floor(Math.random() * words.length)], word = pick[0];
        e.dataset.verb = pick[1];
        var s = document.createElement('div');
        s.className = 'spinner';
        e.appendChild(s);
        var i = 0;
        function frame() { s.innerHTML = frames[i++ % frames.length] + ' ' + word + ' <span class="hint">(esc to interrupt)</span>'; }
        frame();
        var t = setInterval(frame, 110);
        bottom();
        return new Promise(function (done) { setTimeout(function () { clearInterval(t); s.remove(); done(); }, ms); });
      }

      // Type a fragment out character by character, keeping its links and paragraphs intact.
      function stream(body, frag) {
        body.appendChild(frag);
        var walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT), nodes = [], node;
        while ((node = walker.nextNode())) {
          var text = node.textContent.replace(/\s+/g, ' ');
          if (!text.trim()) { node.textContent = ''; continue; }
          nodes.push({ node: node, text: node.previousSibling ? text : text.replace(/^ /, '') });
          node.textContent = '';
        }
        var ni = 0, ci = 0;
        return new Promise(function (done) {
          (function tick() {
            for (var k = 0; k < 5 && ni < nodes.length; k++) {
              var cur = nodes[ni];
              cur.node.textContent += cur.text[ci++];
              if (ci >= cur.text.length) { ni++; ci = 0; }
            }
            bottom();
            if (ni < nodes.length) requestAnimationFrame(tick); else done();
          })();
        });
      }

      function submit(raw) {
        var text = raw.trim();
        if (!text || busy) return;
        history.push(text); hIndex = history.length;
        var cmd = text === '?' ? COMMANDS['/help'] : COMMANDS[text.split(/\s+/)[0]];
        if (cmd && cmd.silent) { cmd.run(); return; }
        var e = entry(text);
        bottom(true);
        if (!cmd) {
          reply(e).innerHTML = text[0] === '/'
            ? 'Unknown command: ' + esc(text) + '. Type <span class="cmd">/help</span> to see what’s available.'
            : 'I only answer a few commands here. Try <span class="cmd">/bio</span>.';
          bottom();
          return;
        }
        busy = true;
        Promise.resolve(cmd.instant ? null : think(e, 700))
          .then(function () { return cmd.run(reply(e)); })
          .then(function () {
            if (cmd.instant) { busy = false; bottom(); return; }
            var d = document.createElement('div');
            d.className = 'done';
            d.textContent = '✻ ' + e.dataset.verb + ' for ' + Math.max(1, Math.round((Date.now() - e.dataset.start) / 1000)) + 's';
            e.appendChild(d);
            busy = false; bottom();
          });
      }

      input.addEventListener('input', function () {
        // Like Claude Code, "?" on an empty prompt lists commands right away, no Enter needed.
        if (input.value === '?') { input.value = ''; render(); submit('?'); return; }
        sel = 0; render();
      });
      input.addEventListener('keydown', function (ev) {
        var m = matches();
        if (ev.key === 'Enter') {
          ev.preventDefault();
          // Enter on an empty prompt runs /bio.
          var v = m.length ? m[sel] : input.value.trim() || '/bio';
          input.value = '';
          render();
          submit(v);
        } else if (ev.key === 'Tab' && m.length) {
          ev.preventDefault();
          input.value = m[sel]; render();
        } else if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
          ev.preventDefault();
          var d = ev.key === 'ArrowUp' ? -1 : 1;
          if (m.length) { sel = (sel + d + m.length) % m.length; render(); return; }
          hIndex = Math.max(0, Math.min(history.length, hIndex + d));
          input.value = history[hIndex] || ''; render();
        } else if (ev.key === 'Escape') {
          input.value = ''; render();
        } else if (ev.key === 'l' && ev.ctrlKey) {
          ev.preventDefault(); log.innerHTML = '';
        } else if (ev.key === 'ArrowLeft' || ev.key === 'Home') {
          ev.preventDefault();
        }
      });
      // Clicking anywhere (except a link, or after selecting text) puts focus back in the prompt.
      document.addEventListener('click', function (ev) {
        if (ev.target.closest('a') || String(window.getSelection())) return;
        input.focus();
      });
      menu.addEventListener('mousedown', function (ev) {
        var row = ev.target.closest('.row');
        if (!row) return;
        ev.preventDefault();
        input.value = row.querySelector('.name').textContent; render(); input.focus();
      });

      render();
      input.focus();
    })();
  </script>
</body>
</html>
